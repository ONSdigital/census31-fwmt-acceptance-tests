# GCP dev profile for local acceptance runs via kubectl port-forward.
# Targets cluster: c31-fwmtg-dev (namespace: fwmt)
#
# Required tunnels:
#   kubectl -n fwmt port-forward svc/job-service 18025:80
#   kubectl -n fwmt port-forward svc/outcome-service 18030:80
#   kubectl -n fwmt port-forward svc/csv-service 18060:80
#   kubectl -n fwmt port-forward svc/fwmtgatewaytmmock 18000:80
#   kubectl -n fwmt port-forward pod/<pod-with-cloud-sql-proxy> 15432:5432

# Service URLs (local side of port-forwards)
service.jobservice.url=http://localhost:18025
service.jobservice.username=user
service.jobservice.password=password

service.outcome.url=http://localhost:18030
service.outcome.username=user
service.outcome.password=password

# Align outcome endpoints to the values used by in-cluster acceptance job config.
service.outcome.HH.endpoint=/householdOutcome/
service.outcome.CCSPL.endpoint=/ccsPropertyListingOutcome
service.outcome.CCSInt.endpoint=/ccsInterviewOutcome/
service.outcome.SPG.endpoint=/spgOutcome/
service.outcome.SPGNewUnit.endpoint=/SpgOutcome/unitAddress/new
service.outcome.SPGStandalone.endpoint=/SpgOutcome/standaloneAddress/new

service.tm.url=http://localhost:18000
service.tm.username=
service.tm.password=
service.mocktm.url=http://localhost:18000

service.ccscsv.url=http://localhost:18060/ingestCCSCsvFile
service.cecsv.url=http://localhost:18060/ingestCeCsvFile
service.addresscheckcsv.url=http://localhost:18060/ingestAddressCheckCsvFile
service.addressfileload.url=http://localhost:18060/ingestAddressLookupCsvFile
service.csvservice.username=user
service.csvservice.password=password
service.csvservice.gcpBucket.directory=gs://csv-bucket-test/

# Database via local Cloud SQL proxy tunnel.
# db-config in c31-fwmtg-dev reports db-name=fwmtgateway.
# Override username/password as needed when running tests.
spring.datasource.url=jdbc:postgresql://localhost:15432/fwmtgateway?currentSchema=fwmtg
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.schema=classpath:/schema.sql
spring.datasource.continue-on-error=false
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.initialization-mode=always

# Pub/Sub in real GCP project.
fwmt.pubsub.project=c31-fwmtg-dev
fwmt.pubsub.mode=gcp
fwmt.pubsub.allowServiceSubscriptionDrain=false

# Messaging configuration
outcomeservice.reasonCodeLookup.path=classpath:/reasonCodeLookup.txt
