# GCP-target overrides for manual local-against-GCP acceptance workflow.
# These defaults assume:
# - kubectl port-forward tunnels are running (job-service 18025, outcome-service 18030, csv-service 18060, tm-mock 18000)
# - Cloud SQL Proxy is running on localhost:15432
# - Dedicated acceptance DB exists (e.g. fwmtgateway_acceptance)

# Service URLs (point to local port-forwards)
service.jobservice.url=http://localhost:18025
service.jobservice.username=user
service.jobservice.password=password

service.outcome.url=http://localhost:18030
service.outcome.username=user
service.outcome.password=password

service.tm.url=http://localhost:18000
service.tm.username=
service.tm.password=

service.mocktm.url=http://localhost:18000

service.ccscsv.url=http://localhost:18060/ingestCCSCsvFile
service.cecsv.url=http://localhost:18060/ingestCeCsvFile
service.addresscheckcsv.url=http://localhost:18060/ingestAddressCheckCsvFile
service.addressfileload.url=http://localhost:18060/ingestAddressLookupCsvFile
service.csvservice.username=user
service.csvservice.password=password
service.csvservice.gcpBucket.directory=gs://csv-bucket-test/

# Database: Cloud SQL Proxy on local port 15432, pointing to dedicated acceptance DB
# Override database name, username, and password at test-run time via -D properties
spring.datasource.url=jdbc:postgresql://localhost:15432/fwmtgateway_acceptance?currentSchema=fwmtg
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.schema=classpath:/schema.sql
spring.datasource.continue-on-error=false
spring.datasource.username=fwmtg_acceptance
spring.datasource.password=changeme
spring.datasource.initialization-mode=always

# Pub/Sub: use real GCP project instead of emulator
fwmt.pubsub.project=c31-fwmtg-dev
fwmt.pubsub.mode=gcp

# Messaging configuration
outcomeservice.reasonCodeLookup.path=classpath:/reasonCodeLookup.txt

