# GCP dev in-cluster profile for acceptance tests running inside Kubernetes.
# Targets cluster: c31-fwmtg-dev (namespace: fwmt)

# Service URLs (Kubernetes service DNS)
service.jobservice.url=http://job-service:80
service.jobservice.username=user
service.jobservice.password=password

service.outcome.url=http://outcome-service:80
service.outcome.username=user
service.outcome.password=password
service.outcome.HH.endpoint=/householdOutcome/
service.outcome.CCSPL.endpoint=/ccsPropertyListingOutcome
service.outcome.CCSInt.endpoint=/ccsInterviewOutcome/
service.outcome.SPG.endpoint=/spgOutcome/
service.outcome.SPGNewUnit.endpoint=/SpgOutcome/unitAddress/new
service.outcome.SPGStandalone.endpoint=/SpgOutcome/standaloneAddress/new

service.tm.url=http://fwmtgatewaytmmock:80
service.tm.username=user
service.tm.password=password
service.mocktm.url=http://fwmtgatewaytmmock:80

service.ccscsv.url=http://csv-service:80/ingestCCSCsvFile
service.cecsv.url=http://csv-service:80/ingestCeCsvFile
service.addresscheckcsv.url=http://csv-service:80/ingestAddressCheckCsvFile
service.addressfileload.url=http://csv-service:80/ingestAddressLookupCsvFile
service.csvservice.username=user
service.csvservice.password=password
service.csvservice.gcpBucket.directory=gs://csv-bucket-test/

# Database via the Cloud SQL proxy sidecar running inside the same pod.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:fwmtgateway}?currentSchema=fwmtg
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.schema=classpath:/schema.sql
spring.datasource.continue-on-error=false
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.initialization-mode=always

# Pub/Sub in real GCP project.
fwmt.pubsub.project=c31-fwmtg-dev
fwmt.pubsub.mode=gcp
fwmt.pubsub.allowServiceSubscriptionDrain=false

# Messaging configuration
outcomeservice.reasonCodeLookup.path=classpath:/reasonCodeLookup.txt